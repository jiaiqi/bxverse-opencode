<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BX 版本管理台 · 原型 v2（精密仪器方向）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   BX 版本管理台 · 原型 v2 —— 精密仪器（Precision Instrument）
   深色优先；版本号即视觉主角；细网格呼应 git graph；
   无大面积 blur（性能/对比度），半透明分层 + 顶部光晕。
   ============================================================ */

:root {
  /* ---- 主题令牌（dark 默认） ---- */
  --bg: #0B0D10;
  --bg-grid: rgba(255, 255, 255, 0.025);
  --bg-glow: rgba(0, 201, 110, 0.07);
  --bg-glow-2: rgba(77, 159, 255, 0.05);
  --surface-1: #12151B;
  --surface-2: #181C24;
  --surface-3: #1E232D;
  --surface-hover: #1A1F28;
  --border: #20262F;
  --border-strong: #2C3542;
  --text-1: #E9EDF2;
  --text-2: #9AA4B2;
  --text-3: #5E6A78;
  --brand: #00C96E;
  --brand-hover: #1FD98A;
  --brand-pressed: #00B160;
  --brand-soft: rgba(0, 201, 110, 0.12);
  --brand-soft-2: rgba(0, 201, 110, 0.2);
  --brand-ring: rgba(0, 201, 110, 0.35);
  --info: #4D9FFF;
  --info-soft: rgba(77, 159, 255, 0.12);
  --warn: #FFB454;
  --warn-soft: rgba(255, 180, 84, 0.12);
  --error: #FF6B6B;
  --error-soft: rgba(255, 107, 107, 0.12);
  --success: #00C96E;
  --success-soft: rgba(0, 201, 110, 0.12);

  --font-sans: "Sora", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 14px;
  --radius-xl: 20px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --dur-fast: 140ms;
  --dur-base: 200ms;
  --dur-slow: 260ms;

  --sidebar-w: 248px;
  --topbar-h: 56px;
}

html[data-theme="light"] {
  --bg: #F4F6F8;
  --bg-grid: rgba(15, 23, 42, 0.035);
  --bg-glow: rgba(0, 150, 90, 0.08);
  --bg-glow-2: rgba(77, 130, 255, 0.07);
  --surface-1: #FFFFFF;
  --surface-2: #FAFBFC;
  --surface-3: #F0F2F5;
  --surface-hover: #F2F4F7;
  --border: #E2E6EC;
  --border-strong: #C9D0DA;
  --text-1: #11161D;
  --text-2: #4B5563;
  --text-3: #8B96A3;
  --brand: #00A85E;
  --brand-hover: #009353;
  --brand-pressed: #008C4F;
  --brand-soft: rgba(0, 168, 94, 0.1);
  --brand-soft-2: rgba(0, 168, 94, 0.18);
  --brand-ring: rgba(0, 168, 94, 0.3);
  --info: #2563EB;
  --info-soft: rgba(37, 99, 235, 0.1);
  --warn: #D97706;
  --warn-soft: rgba(217, 119, 6, 0.1);
  --error: #DC2626;
  --error-soft: rgba(220, 38, 38, 0.1);
  --success: #00A85E;
  --success-soft: rgba(0, 168, 94, 0.1);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-1);
  background:
    radial-gradient(1100px 420px at 50% -140px, var(--bg-glow), transparent 70%),
    radial-gradient(700px 380px at 108% -80px, var(--bg-glow-2), transparent 70%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
/* 细网格背景（呼应 git graph） */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
  z-index: 0;
}
a { color: inherit; text-decoration: none; }
button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}
:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--brand-soft-2); }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 通用组件 ============ */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.02em; }

/* 按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--radius-m);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  background: var(--surface-1);
  border: 1px solid var(--border);
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  white-space: nowrap;
  user-select: none;
}
.btn:hover { color: var(--text-1); background: var(--surface-hover); border-color: var(--border-strong); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.btn-primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #04140B;
  font-weight: 600;
}
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: #04140B; }
.btn-primary:active { transform: scale(0.97); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-hover); border-color: transparent; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-s); gap: 5px; }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: var(--radius-m); }
.btn-icon.btn-sm { width: 26px; height: 26px; }
.btn-danger-text { color: var(--error); }
.btn-danger-text:hover { background: var(--error-soft); border-color: transparent; color: var(--error); }

/* 图标（原型用内联 SVG 简单绘制；正式实现仍走 carbon presetIcons） */
.ic { width: 15px; height: 15px; flex-shrink: 0; display: inline-block; vertical-align: -2px; }
.ic-sm { width: 13px; height: 13px; }

/* 徽章：版本/状态 chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  color: var(--text-2);
  background: var(--surface-3);
  border: 1px solid var(--border);
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.chip-brand { color: var(--brand); background: var(--brand-soft); border-color: rgba(0, 201, 110, 0.25); }
.chip-info { color: var(--info); background: var(--info-soft); border-color: rgba(77, 159, 255, 0.25); }
.chip-warn { color: var(--warn); background: var(--warn-soft); border-color: rgba(255, 180, 84, 0.25); }
.chip-error { color: var(--error); background: var(--error-soft); border-color: rgba(255, 107, 107, 0.25); }
.chip-dim { color: var(--text-3); background: transparent; border-color: var(--border); }
.code-chip { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }

/* 版本徽章：仪器读数风（里程碑实心 / 构建描边） */
.version-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px 0 0;
  border-radius: var(--radius-s);
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  overflow: hidden;
  white-space: nowrap;
}
.version-badge .tick {
  align-self: stretch;
  width: 3px;
  background: var(--brand);
  margin-right: 8px;
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 8px var(--brand-ring);
}
.version-badge.ghost .tick { background: var(--info); box-shadow: 0 0 8px rgba(77,159,255,.35); }
.version-badge .suffix { color: var(--text-3); font-weight: 400; }

/* 卡片 */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  transition: border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out),
              box-shadow var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.card-hover:hover {
  border-color: var(--border-strong);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255,255,255,0.015);
  transform: translateY(-1px);
}
.card-pad { padding: 18px; }

/* 空状态 */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 44px 20px;
  text-align: center;
  color: var(--text-3);
}
.empty .e-ic {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-3);
  margin-bottom: 4px;
}
.empty .e-title { font-size: 14.5px; font-weight: 600; color: var(--text-1); }
.empty .e-desc { font-size: 12.5px; max-width: 320px; }

/* 骨架屏 */
.skeleton {
  border-radius: var(--radius-s);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite linear;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* 表单 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field-label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.field input, .field select, .field textarea {
  height: 34px;
  padding: 0 12px;
  border-radius: var(--radius-m);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-1);
  font-family: inherit;
  font-size: 13px;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-ring);
  background: var(--surface-1);
}
.field textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.field .hint { font-size: 11.5px; color: var(--text-3); }

/* 开关 */
.switch {
  position: relative;
  width: 38px; height: 21px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--text-2);
  transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.switch.on { background: var(--brand); border-color: var(--brand); }
.switch.on::after { transform: translateX(17px); background: #04140B; }

/* 弹窗/抽屉遮罩 */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 7, 10, 0.55);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-base) var(--ease-out);
  z-index: 50;
}
.overlay.open { opacity: 1; pointer-events: auto; }

/* 抽屉 */
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(560px, 92vw);
  background: var(--surface-1);
  border-left: 1px solid var(--border);
  z-index: 51;
  transform: translateX(100%);
  transition: transform var(--dur-slow) var(--ease-out);
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px; height: 56px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.drawer-head .d-title { font-size: 15px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 10px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }

/* 模态 */
.modal {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  opacity: 0;
  pointer-events: none;
  width: min(520px, 92vw);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-l);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
  z-index: 52;
  transition: transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
}
.modal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
.modal-head .m-title { font-size: 15px; font-weight: 600; flex: 1; }
.modal-body { padding: 16px 20px; overflow-y: auto; }
.modal-foot { padding: 0 20px 18px; display: flex; justify-content: flex-end; gap: 8px; }

/* ============ 布局壳 ============ */
.shell { display: flex; height: 100vh; position: relative; z-index: 1; }

/* 侧栏 */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: rgba(16, 19, 25, 0.78);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(14px) saturate(130%);
  transition: width var(--dur-base) var(--ease-out);
  overflow: hidden;
}
html[data-theme="light"] .sidebar { background: rgba(255, 255, 255, 0.8); }
.shell.collapsed .sidebar { width: 64px; }
.sb-logo {
  display: flex; align-items: center; gap: 10px;
  height: var(--topbar-h);
  padding: 0 18px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.sb-logo .mark {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  background: var(--brand);
  color: #04140B;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 0 16px var(--brand-ring);
  flex-shrink: 0;
}
.sb-logo .name { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
.sb-logo .name small { display: block; font-size: 10px; font-weight: 400; color: var(--text-3); font-family: var(--font-mono); letter-spacing: 0.06em; }
.shell.collapsed .sb-logo .name { display: none; }
.shell.collapsed .sb-logo { justify-content: center; padding: 0; }

.sb-nav { flex: 1; overflow-y: auto; padding: 10px 10px; }
.sb-group {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 10px 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text-3);
  text-transform: uppercase;
  white-space: nowrap;
}
.shell.collapsed .sb-group { justify-content: center; padding: 12px 0 6px; }
.sb-item {
  display: flex; align-items: center; gap: 10px;
  height: 36px;
  padding: 0 10px;
  margin-bottom: 2px;
  border-radius: var(--radius-m);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
  position: relative;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  cursor: pointer;
}
.sb-item:hover { background: var(--surface-hover); color: var(--text-1); }
.sb-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.sb-item.active::before {
  content: "";
  position: absolute;
  left: -10px; top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--brand);
  box-shadow: 0 0 10px var(--brand-ring);
}
.sb-item .ic { opacity: 0.75; }
.sb-item.active .ic { opacity: 1; }
.sb-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.sb-item .badge-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-ring);
  flex-shrink: 0;
}
.shell.collapsed .sb-item { justify-content: center; padding: 0; }
.shell.collapsed .sb-item .label, .shell.collapsed .sb-item .badge-dot { display: none; }
.shell.collapsed .sb-group span { display: none; }

.sb-foot {
  flex-shrink: 0;
  padding: 8px 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sb-foot .sb-item { text-align: left; width: 100%; }
.shell.collapsed .sb-foot { align-items: center; }
.shell.collapsed .sb-foot .sb-item { width: 36px; text-align: center; }
.sb-kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 1px 5px;
  background: var(--surface-2);
}

/* 主区 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* 顶栏 */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(13, 16, 21, 0.6);
  backdrop-filter: blur(14px) saturate(130%);
  flex-shrink: 0;
  position: relative;
  z-index: 5;
}
html[data-theme="light"] .topbar { background: rgba(255, 255, 255, 0.7); }
.tb-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-title .crumb { color: var(--text-3); font-weight: 400; font-size: 12.5px; }
.tb-title .crumb-sep { color: var(--text-3); opacity: 0.5; }
.tb-spacer { flex: 1; }
.tb-search {
  display: flex; align-items: center; gap: 8px;
  height: 32px;
  width: 230px;
  padding: 0 12px;
  border-radius: var(--radius-m);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 12.5px;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), width var(--dur-base) var(--ease-out);
  cursor: text;
}
.tb-search:hover { border-color: var(--border-strong); }
.tb-search.focused { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); width: 300px; }
.tb-search .kbd { margin-left: auto; }

/* 服务状态 */
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 26px; padding: 0 11px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--success-soft);
  color: var(--success);
  border: 1px solid rgba(0, 201, 110, 0.25);
  white-space: nowrap;
}
.status-pill .pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 0 rgba(0, 201, 110, 0.5);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 201, 110, 0.45); }
  70% { box-shadow: 0 0 0 7px rgba(0, 201, 110, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 201, 110, 0); }
}

/* 内容区 */
.content { flex: 1; overflow-y: auto; position: relative; }
.page {
  max-width: 1240px;
  margin: 0 auto;
  padding: 28px 28px 60px;
  animation: page-in var(--dur-slow) var(--ease-out);
}
@keyframes page-in {

/* 页头 */

/* 项目卡 */

/* ============ 发布历史 ============ */

}

}

/* ============ 树 / 列表 ============ */

/* 控制台 */
.console {

.log-editor { border: 1px solid var(--border); border-radius: var(--radius-l); overflow: hidden; background: var(--surface-1); }

/* 向导步骤条 */
.steps { display: flex; align-items: center; margin-bottom: 24px; }
.step {
  display: flex; align-items: center; gap: 9px;

  font-size: 12.5px;

}
.step .s-num {

  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 12px;

}
.step .s-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  border-color: var(--brand);
  color: #04140B;
  box-shadow: 0 0 0 4px var(--brand-ring);
  font-weight: 700;
}
.step-line {
  flex: 1; height: 1.5px;
  background: var(--border);
  margin: 0 12px;
  min-width: 18px;
  position: relative;
  overflow: hidden;
}
.step-line::after {
  content: "";
  position: absolute; inset: 0;
  background: var(--brand);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--dur-base) var(--ease-out);
}
.step-line.passed::after { transform: scaleX(1); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tab {
  position: relative;
  height: 40px;
  padding: 0 16px;
  display: flex; align-items: center; gap: 7px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
  transition: color var(--dur-fast) var(--ease-out);

}
.tab:hover { color: var(--text-1); }
.tab.active { color: var(--brand); font-weight: 600; }
.tab.active::after {
  content: "";
  position: absolute;
  left: 12px; right: 12px; bottom: -1px;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-ring);
}
.tab-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }

/* 向导仓库行 */
.wz-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--border);

  background: var(--surface-1);

  cursor: pointer;
}

.checkbox {

  flex-shrink: 0;
  transition: all var(--dur-fast) var(--ease-out);
  color: transparent;
}

  border-radius: var(--radius-m);

/* 通知 toast */
.toast {
  position: fixed;
  right: 20px; bottom: 20px;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);

/* 页面切换动画 */
.page { animation: page-in var(--dur-slow) var(--ease-out); }

/* stagger 进入 */
.stagger > * {
  opacity: 0;
  transform: translateY(10px);
  animation: page-in var(--dur-slow) var(--ease-out) forwards;
}
.stagger > *:nth-child(1) { animation-delay: 40ms; }
.stagger > *:nth-child(2) { animation-delay: 90ms; }
.stagger > *:nth-child(3) { animation-delay: 140ms; }

}

/* 动效降级 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

}

/* ---------- 交互 ---------- */
const bx = {
  state: { page: 'dashboard', arg: null },
  goto(page, arg) {
    this.state = { page, arg };
    const main = document.getElementById('content');
    // 重设 innerHTML 即重建 DOM，.page 的进入动画（page-in）自动重放
    main.innerHTML = PAGES[page](arg);
    // 侧栏高亮
    document.querySelectorAll('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.pageLink === page));
    // 顶栏标题：主标题 + 面包屑（仅子页面显示路径，重建避免累积）
    let crumbText = '';
    if (page === 'repo') {
      const [pid, rid] = (arg || 'p1/r1').split('/');
      const p = DATA.projects[pid] || DATA.projects.p1;
      const r = p.repos.find(x => x.id === rid) || p.repos[0];
      crumbText = `${p.name} / ${r.display || r.name}`;
    } else if (page === 'release' || page === 'backups') {
      const p = DATA.projects[arg || 'p1'];
      crumbText = p ? p.name : '';
    }
    document.getElementById('tbTitle').innerHTML =
      `<span>${TITLES[page] || ''}</span>${crumbText ? `<span class="crumb">${crumbText}</span>` : ''}`;
    document.title = `${TITLES[page] || '总览'} · BX 版本管理台（原型 v2）`;
    // 初始化页面内交互
    this.bindTabs();
    this.bindTree();
    this.bindSteps();
    this.bindDryRun();
  },
  bindTabs() {
    document.querySelectorAll('.tab[data-tab]').forEach(tab => {
      tab.onclick = () => {
        const root = tab.closest('.card') || document;
        const key = tab.dataset.tab;
        // 同组 tab 高亮
        tab.parentElement.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.toggle('active', t === tab));
        // 有对应面板则切换（files/logs/settings）
        const panels = root.querySelectorAll('[data-tabpanel]');
        if (panels.length) {
          panels.forEach(p => p.style.display = p.dataset.tabpanel === key ? '' : 'none');
        }
      };
    });
  },
  bindTree() {
    document.querySelectorAll('.tree-row[role="button"]').forEach(row => {
      row.onclick = (e) => {
        e.stopPropagation();
        const chev = row.querySelector('.chev');
        if (chev) {
          row.classList.toggle('open');
          const children = row.nextElementSibling;
          // 展开/收起：简单做法——只切换图标
        } else {
          row.parentElement.querySelectorAll('.tree-row').forEach(r => r.classList.remove('active'));
          row.classList.add('active');
        }
      };
    });
  },
  bindSteps() {
    document.querySelectorAll('#wzSteps .step').forEach((s, i) => {
      s.style.cursor = 'pointer';
      s.onclick = () => {
        document.querySelectorAll('#wzSteps .step').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('#wzSteps .step-line').forEach(x => x.classList.remove('passed'));
        s.classList.add('active');
        for (let k = 0; k < i; k++) {
          document.querySelectorAll('#wzSteps .step')[k].classList.add('done');
          document.querySelectorAll('#wzSteps .step-line')[k]?.classList.add('passed');
        }
        for (let k = i + 1; k < 6; k++) document.querySelectorAll('#wzSteps .step')[k].classList.remove('done');
        bx.toast(`原型演示：切换到「${s.querySelector('.s-label').textContent}」步骤`, true);
      };
    });
  },
  bindDryRun() {
    const body = document.getElementById('dryRunBody');
    if (!body) return;
    const lines = [
      ['PC 前端', '[预检] 检查 HEAD / dirty / 里程碑标签', 'step'],
      ['PC 前端', '$ pnpm build', 'cmd'],
      ['PC 前端', 'git tag v2.5.0', 'cmd'],
      ['PC 前端', 'git tag build/v2.5.0.26081728', 'cmd'],
      ['数据可视化', '[预检] 检查 HEAD / dirty / 里程碑标签', 'step'],
      ['数据可视化', 'git tag v2.5.0', 'cmd'],
      ['微信小程序', '[预检] 检查 HEAD / dirty / 里程碑标签', 'step'],
      ['微信小程序', 'git tag v2.5.0', 'cmd'],
      ['（项目）', '写发布记录 → releases/v2.5.0/data.json + 双轨日志', 'cmd'],
      ['（数据仓库）', '里程碑标签 v2.5.0 + commit', 'cmd'],
      ['（远程）', '离线模式：跳过推送', 'cmd'],
    ];
    body.innerHTML = lines.map(l => `
      <div class="console-line ${l[2] === 'step' ? 'step' : ''}">
        <span class="ln-repo">${l[0]}</span>
        <span class="ln-cmd">${l[1]}</span>
      </div>`).join('') + `<div class="console-line console-cursor"><span class="ln-repo"></span><span class="ln-cmd">准备执行…</span></div>`;
  },
  wizardRun() {
    const body = document.getElementById('dryRunBody');
    if (!body) return;
    const steps = [
      ['PC 前端', 'git tag v2.5.0', 'cmd'], ['PC 前端', '✓ tag 创建成功', 'done'],
      ['PC 前端', '写入 version.json / version-history.json', 'cmd'],
      ['数据可视化', 'git tag v2.5.0', 'cmd'], ['数据可视化', '✓ tag 创建成功', 'done'],
      ['（数据仓库）', 'commit 发布记录 + 里程碑标签', 'cmd'],
      ['（项目）', '★ 发布完成：v2.5.0 · 3 个仓库全部成功', 'done'],
    ];
    body.innerHTML = '';
    let i = 0;
    const timer = setInterval(() => {
      if (i >= steps.length) { clearInterval(timer); bx.toast('发布完成：v2.5.0'); return; }
      const [repo, cmd, type] = steps[i++];
      const div = document.createElement('div');
      div.className = 'console-line ' + (type === 'done' ? 'done' : '');
      div.innerHTML = `<span class="ln-repo">${repo}</span><span class="ln-cmd">${cmd}</span>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }, 350);
  },
  openRelease(i) {
    const p = DATA.projects.p1;
    const r = p.releases[i];
    if (!r) return;
    document.getElementById('drVersion').innerHTML = `<span class="tick"></span>${r.ver}`;
    document.getElementById('drBump').textContent = r.bump === 'minor' ? '次版本' : '补丁';
    document.getElementById('drPushed').innerHTML = `${ICONS.cloud}${r.pushed ? '已推送' : '未推送'}`;
    document.getElementById('drMeta').innerHTML = `
      <span class="chip chip-dim">${ICONS.cube}${r.repos} 仓库</span>
      <span class="chip chip-dim">${ICONS.commit}${r.commits} 提交</span>
      <span class="chip chip-dim">${ICONS.tag}+${r.ins} / -${r.del}</span>
      <span class="chip chip-dim">${ICONS.clock}${r.date}</span>`;
    document.getElementById('drLog').innerHTML = `
      <h3 style="font-size:13px;margin:0 0 8px;color:var(--text-1)">对外日志（用户可见）</h3>
      <p style="margin:0 0 12px">本版本新增发布向导提交级排除、版本清单「仅日期」导出；优化深链刷新与目录树渲染。</p>
      <h3 style="font-size:13px;margin:0 0 8px;color:var(--text-1)">对内日志（全量技术细节）</h3>
      <ul style="padding-left:18px;margin:0">
        <li>engine.ts：发布流程挂接备份步骤，tag 后源码备份、build 后产物备份</li>
        <li>backups.ts：新增下载/校验/对比/删除路由</li>
        <li>ReleaseWizard.vue：步骤守卫、SSE 控制台、中断续跑</li>
      </ul>`;
    this.openDrawer('release-drawer');
  },
  openDrawer(id) {
    document.getElementById(id).classList.add('open');
    document.querySelector(`[data-overlay="${id}"]`).classList.add('open');
  },
  closeDrawer(id) {
    document.getElementById(id).classList.remove('open');
    document.querySelector(`[data-overlay="${id}"]`).classList.remove('open');
  },
  openModal(id) {
    document.getElementById(id).classList.add('open');
    document.querySelector(`[data-overlay="${id}"]`).classList.add('open');
    if (id === 'paletteModal') document.getElementById('paletteInput').focus();
  },
  closeModal(id) {
    document.getElementById(id).classList.remove('open');
    document.querySelector(`[data-overlay="${id}"]`).classList.remove('open');
  },
  toast(msg, silent) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('show'), 2200);
  },
  pickTheme(kind, el) {
    document.querySelectorAll('.theme-opt').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    document.documentElement.dataset.theme = kind === 'light' ? 'light' : 'dark';
    this.syncThemeUI();
    this.toast('主题已切换（原型演示）');
  },
  syncThemeUI() {
    const dark = document.documentElement.dataset.theme !== 'light';
    document.getElementById('sbThemeLabel').textContent = dark ? '深色' : '亮色';
  },
  toggleTheme() {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    this.syncThemeUI();
    document.querySelectorAll('.theme-opt').forEach(x => x.classList.remove('selected'));
  },
};

/* ---------- 事件绑定 ---------- */
document.querySelectorAll('.sb-item[data-page-link]').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    bx.goto(el.dataset.pageLink, el.dataset.pageArg);
  });
});
document.getElementById('sbThemeToggle').addEventListener('click', () => bx.toggleTheme());
document.getElementById('tbTheme').addEventListener('click', () => bx.toggleTheme());
document.getElementById('tbSync').addEventListener('click', () => bx.toast('数据仓库已同步'));
document.getElementById('tbNewProject').addEventListener('click', () => bx.openModal('new-project'));
document.getElementById('sbPalette').addEventListener('click', () => bx.openModal('paletteModal'));
document.getElementById('tbSearch').addEventListener('click', () => bx.openModal('paletteModal'));
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    bx.openModal('paletteModal');
  }
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal.open, .drawer.open').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.overlay.open').forEach(el => el.classList.remove('open'));
  }
});
document.querySelectorAll('[data-close]').forEach(el => {
  el.addEventListener('click', () => {
    const id = el.dataset.close;
    const el2 = document.getElementById(id);
    if (el2 && el2.classList.contains('modal')) bx.closeModal(id);
    else bx.closeDrawer(id);
  });
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', () => {
    ov.classList.remove('open');
    document.querySelectorAll('.modal.open, .drawer.open').forEach(el => el.classList.remove('open'));
  });
});

/* 命令面板内容 */
const paletteCommands = [
  { group: '页面', title: '总览', icon: 'cube', run: () => bx.goto('dashboard') },
  { group: '页面', title: '设置', icon: 'palette', run: () => bx.goto('settings') },
  { group: '项目', title: '主产品线', icon: 'folder', run: () => bx.goto('project', 'p1') },
  { group: '项目', title: '移动端矩阵', icon: 'folder', run: () => bx.goto('project', 'p2') },
  { group: '仓库', title: 'PC 前端', icon: 'git', run: () => bx.goto('repo', 'p1/r1') },
  { group: '仓库', title: '数据可视化', icon: 'git', run: () => bx.goto('repo', 'p1/r2') },
  { group: '发布', title: '开始发布', icon: 'rocket', run: () => bx.goto('release', 'p1') },
];
function renderPalette(q) {
  const list = paletteCommands.filter(c => !q || c.title.includes(q) || c.group.includes(q));
  document.getElementById('paletteResults').innerHTML = list.length
    ? list.map(c => `
      <button class="sb-item" style="width:100%;margin:0;border-radius:var(--radius-m)"
        onclick="bx.closeModal('paletteModal');c.run()" data-cmd='${JSON.stringify(c.run.toString())}'>
        <span style="opacity:.7">${ICONS[c.icon]}</span><span class="label">${c.title}</span>
      </button>`).join('')
    : '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:13px">没有匹配的命令</div>';
}
document.getElementById('paletteInput').addEventListener('input', e => renderPalette(e.target.value));
renderPalette('');

/* 初始渲染 */
bx.goto('dashboard');
bx.syncThemeUI();
</script>
</body>
</html>
